# Pages config (source of truth for bindings). Downloaded project settings had no vars/bindings before this file.
name = "whichpadel"
compatibility_date = "2026-10-20"
pages_build_output_dir = "dist"

[[kv_namespaces]]
binding = "SUBSCRIBERS"
id = "030127a373d949d4a7f83b9e845ececf"
preview_id = "aea3c86a469447f7b439a2d171c89cd9"

[[kv_namespaces]]
binding = "AFFILIATE"
id = "98b1fbef5aac49d684383bfb12893812"

[[d1_databases]]
binding = "ACCT"
database_name = "whichpadel-accounts"
database_id = "18a6503d-938d-4b46-9c0d-07022fb5ab98"
preview_database_id = "2dbd9911-d4cd-4d04-8c6f-9f391ceabf96"

[[services]]
binding = "PRICES"
service = "whichpadel-prices"

[[services]]
binding = "US"
service = "whichpadel-us-prices"

[[services]]
binding = "SHOES"
service = "whichpadel-shoe-prices"

