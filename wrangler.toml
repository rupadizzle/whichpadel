# Pages config (source of truth for bindings). Downloaded project settings had no vars/bindings before this file.
name = "whichpadel"
compatibility_date = "2026-10-20"
pages_build_output_dir = "dist"

[[kv_namespaces]]
binding = "SUBSCRIBERS"
id = "030127a373d949d4a7f83b9e845ececf"

# Accounts, saved rackets, newsletter signups, and price-alert signups.
# database_id is filled once whichpadel-accounts exists. Until then this binding is absent and those routes return 503.
# [[d1_databases]]
# binding = "ACCT"
# database_name = "whichpadel-accounts"
# database_id = ""

# Sign-in mail only. The from address must belong to an onboarded Email Sending domain.
[[send_email]]
name = "EMAIL"
allowed_sender_addresses = [ "noreply@whichpadel.com" ]

# Price Workers reached via service bindings (same-zone fetch to a Worker route is not reliable from Functions).
# PRICES = production racket Worker (unchanged); US + SHOES = US and shoe price Workers (own D1s, cron every 10 min).
[[services]]
binding = "PRICES"
service = "whichpadel-prices"

[[services]]
binding = "US"
service = "whichpadel-us-prices-preview"

[[services]]
binding = "SHOES"
service = "whichpadel-shoe-prices-preview"
