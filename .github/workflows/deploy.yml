name: Deploy
on:
  push:
    branches: ['**']
  workflow_dispatch:
concurrency: { group: "${{ github.ref_name == 'main' && 'deploy' || format('preview-{0}', github.ref_name) }}", cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # data/fx.json is generated by scripts/fx.mjs inside npm run build; prices/match/matches.json is only used by price seeding, not the site build
      - run: node scripts/translate-missing.mjs || true
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        run: npx -y wrangler@latest pages deploy dist --project-name whichpadel --branch "$GITHUB_REF_NAME" --commit-hash "$GITHUB_SHA"
      - name: Live check
        if: github.ref_name == 'main'
        run: |
          sleep 10
          for p in / /rackets/ /balls/; do c=$(curl -s -o /dev/null -w '%{http_code}' "https://whichpadel.com$p"); echo "$p $c"; [ "$c" = 200 ]; done
      - name: Site checks (report only)
        continue-on-error: true
        run: |
          npx -y playwright-core install --with-deps chromium >/dev/null 2>&1 || true
          (npx astro preview --port 4987 --host 127.0.0.1 >/tmp/srv.log 2>&1 &); sleep 5
          export QA_FAST=1 QA_WIDTHS=390,1280 QA_PAGES=$(node scripts/smoke-pages.mjs)
          echo "## Site checks (non-blocking)" >> $GITHUB_STEP_SUMMARY
          bad=0
          for j in "curtext|CURTEXT PASS|curtextqa.mjs" "mix|^0 issues|mixqa.mjs" "px|PXQA PASS|pxqa.mjs" "seo|, 0 issues$|seoqa.mjs" "qa|^QA PASS|qa.mjs" "layout|LAYOUT VIOLATIONS 0|layoutqa.mjs" "pad|^PAD .*, PASS$|padqa.mjs" "geo|GEOQA PASS|geoqa.mjs" "cmp|CMPQA PASS|cmpqa.mjs" "picker|PICKERQA PASS|pickerqa.mjs"; do
            IFS='|' read -r n p c <<<"$j"; node $c > $n.log 2>&1 || true
            if grep -qE "$p" $n.log; then echo "- ✅ $n" >> $GITHUB_STEP_SUMMARY; else bad=1; echo "- ❌ $n" >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY; grep -iE 'fail|issue|/' $n.log | head -15 >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY; fi
          done
          [ $bad = 0 ] || echo "::warning title=Site checks failed::See the run summary (non-blocking)"
          exit $bad
