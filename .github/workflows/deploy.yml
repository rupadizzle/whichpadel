name: Deploy
on:
  push:
    branches: ['**']
  workflow_dispatch:
concurrency: { group: "${{ github.ref_name == 'main' && 'deploy' || format('preview-{0}', github.ref_name) }}", cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: node scripts/translate-missing.mjs
      - run: node scripts/redirectsqa.mjs
      - run: npm run build
      - name: Site checks
        env:
          NODE_OPTIONS: --max-old-space-size=6144   # seoqa holds every page's hreflang map; the default heap runs out
        run: |
          npx -y playwright-core install --with-deps chromium >/dev/null 2>&1 || true
          (npx astro preview --port 4987 --host 127.0.0.1 >/tmp/srv.log 2>&1 &); sleep 5
          export QA_FAST=1 QA_WIDTHS=360,390,1280 QA_PAGES=$(node scripts/smoke-pages.mjs)
          echo "## Site checks" >> $GITHUB_STEP_SUMMARY
          bad=0
          for j in "curtext|CURTEXT PASS|curtextqa.mjs" "mix|^0 issues|mixqa.mjs" "px|PXQA PASS|pxqa.mjs" "seo|, 0 issues$|seoqa.mjs" "qa|^QA PASS|qa.mjs" "layout|LAYOUT VIOLATIONS 0|layoutqa.mjs" "pad|^PAD .*, PASS$|padqa.mjs" "geo|GEOQA PASS|geoqa.mjs" "cmp|CMPQA PASS|cmpqa.mjs" "picker|PICKERQA PASS|pickerqa.mjs"; do
            IFS='|' read -r n p c <<<"$j"; node qa/$c > $n.log 2>&1 || true
            if grep -qE "$p" $n.log; then echo "PASS $n"; echo "- ✅ $n" >> $GITHUB_STEP_SUMMARY; else bad=1; echo "FAIL $n"; tail -n 25 $n.log; echo "- ❌ $n" >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY; grep -iE 'fail|issue|/' $n.log | head -15 >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY; fi
          done
          pkill -f "astro preview" || true
          [ $bad = 0 ] || echo "::error title=Site checks failed::See the run summary"
          exit $bad
      - name: Deploy sender Worker
        if: github.ref_name == 'main'
        run: npx -y wrangler@latest deploy --config email-send/wrangler.toml
      - name: Deploy to Cloudflare Pages
        if: github.ref_name == 'main' || contains(github.event.head_commit.message, '[preview]') || contains(join(github.event.commits.*.message, '\n'), '[preview]')
        shell: bash
        run: set -o pipefail; npx -y wrangler@latest pages deploy dist --project-name whichpadel --branch "$GITHUB_REF_NAME" --commit-hash "$GITHUB_SHA" | tee deploy.log
      - name: Live check
        if: github.ref_name == 'main' || contains(github.event.head_commit.message, '[preview]') || contains(join(github.event.commits.*.message, '\n'), '[preview]')
        run: |
          base=https://whichpadel.com
          [ "$GITHUB_REF_NAME" = main ] || base=$(grep -oE 'https://[a-z0-9-]+\.whichpadel\.pages\.dev' deploy.log | tail -1)
          sleep 10; bad=0
          for p in $(node scripts/smoke-pages.mjs | tr ',' ' ') /rackets/ /shoes/ /balls/ /bags/ /deals/ /sitemap.xml; do
            [ "$p" = /404.html ] && continue
            c=$(curl -s -o /dev/null -w '%{http_code}' "$base$p"); echo "$p $c"; [ "$c" = 200 ] || bad=1
          done
          exit $bad
