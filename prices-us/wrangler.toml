# US price engine (preview): same engine as ../prices, separate D1.
# Free plan: one cron expression (account-wide cron budget is 5).
name = "whichpadel-us-prices-preview"
main = "worker.js"
compatibility_date = "2026-10-20"
workers_dev = true
[triggers]
crons = ["1-59/2 * * * *"]
[[d1_databases]]
binding = "DB"
database_name = "whichpadel-us-preview"
database_id = "f045222e-5c07-4f52-b865-b26b9b563a30"
