# Shoe/ball/bag price engine (preview): same code as ../prices, separate D1.
# Free plan: one cron expression (account-wide cron budget is 5).
name = "whichpadel-shoe-prices-preview"
main = "worker.js"
compatibility_date = "2026-10-20"
workers_dev = true
[triggers]
crons = ["1-59/2 * * * *"]
[[d1_databases]]
binding = "DB"
database_name = "whichpadel-shoes-preview"
database_id = "b651759c-4867-40fb-9516-9bc153892c1c"
